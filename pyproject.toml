[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "xauusd-trading-system"
version = "0.1.0"
description = "XAUUSD Quantitative Trading System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}

dependencies = [
    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",
    
    # Data processing
    "numpy>=1.24",
    "pandas>=2.0",
    
    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    
    # HTTP (for data providers)
    "httpx>=0.25",
    
    # Logging
    "structlog>=23.0",
    
    # Timezone
    "pytz>=2023.3",
]

[project.optional-dependencies]
# cTrader integration: imported directly by tools/ctrader_smoke_test/.
# ctrader-open-api is pinned to the documented/tested version; Twisted is a
# direct import in the same tools and is locked via the SDK's own pin (Twisted==24.3.0).
ctrader = [
    "ctrader-open-api==0.9.2",
    "Twisted",
]
# Legacy MT5 terminal bridge (Windows-only). NOT part of the default uv sync
# path; kept only for the legacy MetaAPI/MT5 connector code. Never add to core.
legacy-mt5 = [
    "MetaTrader5; sys_platform == 'win32'",
]
# Research / ML stack. torch comes CPU-only from the PyTorch index (see [tool.uv]).
research = [
    "torch==2.14.0+cpu",
    "stable-baselines3==2.9.0",
    "gymnasium==1.3.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.5",
]

[dependency-groups]
# Dev/CI tooling and test-only dependencies (playwright is used by tests only).
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.15",
    "hypothesis>=6.80",
    "ruff>=0.1",
    "mypy>=1.5",
    "playwright>=1.0",
    "pip-audit==2.7.3",
    "pip-licenses==5.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "temporal: temporal correctness tests",
    "contract: domain contract tests",
    "integration: integration tests",
    "property: property-based tests",
]

# CPU-only torch resolution for reproducible research builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
