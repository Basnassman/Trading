[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "xauusd-trading-system"
version = "0.1.0"
description = "XAUUSD Quantitative Trading System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",
    
    # Data processing
    "numpy>=1.24",
    "pandas>=2.0",
    
    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    
    # HTTP (for data providers)
    "httpx>=0.25",
    
    # Logging
    "structlog>=23.0",
    
    # Timezone
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.80",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "temporal: temporal correctness tests",
    "contract: domain contract tests",
    "integration: integration tests",
    "property: property-based tests",
]
