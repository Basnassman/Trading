[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-trading-system"
version = "0.1.0"
description = "XAUUSD Quantitative Trading System"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}

dependencies = [
    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",

    # Data processing
    "numpy>=1.24",
    "pandas>=2.0",

    # Configuration & validation (directly imported by src/core/config.py etc.)
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # HTTP (for data providers)
    "httpx>=0.25",

    # Logging
    "structlog>=23.0",

    # Timezone
    "pytz>=2023.3",

    # Dashboard / operator console (directly imported by src/, main.py)
    "rich==15.0.0",
    "jinja2==3.1.6",
    "fastapi==0.141.1",

    # Monitoring & alerts (directly imported by src/core/monitor.py, health.py)
    "psutil==7.2.2",
    "prometheus-client==0.26.0",
    "redis==8.1.0",
    "python-telegram-bot==22.8",

    # Model persistence & async bridge (directly imported)
    "joblib==1.6.0",
    "nest-asyncio==1.6.0",

    # Hyperparameter optimization (directly imported by src/research/)
    "optuna==4.9.0",
]

[project.optional-dependencies]
# cTrader integration: imported directly by tools/ctrader_smoke_test/.
# ctrader-open-api is pinned to the documented/tested version; Twisted is a
# direct import in the same tools and is locked via the SDK's own pin (Twisted==24.3.0).
ctrader = [
    "ctrader-open-api==0.9.2",
    "Twisted",
    # Twisted optional TLS hardening; without it the SDK emits a warning and
    # performs only rudimentary certificate hostname verification.
    "service-identity",
]
# Legacy MT5/MetaAPI bridge. NOT part of the default uv sync path; kept only
# for the legacy connector code in src/trading/mt5_connector.py (both imports
# are guarded there). Never add to core. MetaTrader5 is Windows-only; the
# MetaAPI cloud SDK is the cross-platform legacy fallback.
legacy-mt5 = [
    "MetaTrader5; sys_platform == 'win32'",
    "metaapi-cloud-sdk==29.1.1",
]
# Optional TA-Lib Python binding. Requires the TA-Lib C library on the system
# (Docker builds C v0.6.4 from source). All src/ imports of talib are guarded
# with a pandas fallback, so this extra is optional everywhere.
ta-lib = [
    "TA-Lib==0.8.0",
]
# Research / ML stack. torch comes CPU-only from the PyTorch index (see [tool.uv]).
research = [
    "torch==2.14.0+cpu",
    "stable-baselines3==2.9.0",
    "gymnasium==1.3.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
]

[dependency-groups]
# Dev/CI tooling and test-only dependencies (playwright is used by tests only).
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.15",
    "hypothesis>=6.80",
    "ruff>=0.1",
    "mypy>=1.5",
    "playwright>=1.0",
    "pip-audit==2.7.3",
    "pip-licenses==5.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "temporal: temporal correctness tests",
    "contract: domain contract tests",
    "integration: integration tests",
    "property: property-based tests",
]

# CPU-only torch resolution for reproducible research builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
