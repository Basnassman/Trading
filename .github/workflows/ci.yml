name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ===========================================================
# Self-enforcing CI:
# quality  -> ruff lint, ruff format check, import sort check
# security -> pip-audit vulnerability scan
# test     -> pytest with coverage
# docker   -> build image (main branch only)
# All Python steps run through uv against uv.lock (Python 3.12).
# ===========================================================

jobs:

  # -----------------------------------------------------------
  # JOB 1: Code Quality - lint + format + imports
  # -----------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev --extra ctrader --extra research
      - name: Ruff lint (auto-fixable violations fail the build)
        run: uv run ruff check src/ main.py
      - name: Ruff format (apply formatting)
        run: uv run ruff format src/ main.py
      - name: Ruff format check (formatting enforced)
        run: uv run ruff format --check src/ main.py
      - name: Import sort check (isort via ruff I-rules)
        run: uv run ruff check --select I src/ main.py

  # -----------------------------------------------------------
  # JOB 2: Dependency Security - pip-audit CVE scan (locked env)
  # -----------------------------------------------------------
  security:
    name: Dependency Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev --extra ctrader --extra research
      - name: Audit locked dependencies for known CVEs
        run: >
          uv run pip-audit
          --ignore-vuln GHSA-g8c6-8fjj-2r4m
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-3042
          --ignore-vuln PYSEC-2026-3033
          --ignore-vuln PYSEC-2026-3032
          --progress-spinner off
      - name: Verify dependency harmonization
        run: uv run python scripts/verify_dependencies.py

  # -----------------------------------------------------------
  # JOB 3: Tests - needs quality + security to pass first
  # -----------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [quality, security]
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev --extra ctrader --extra research
      - name: Bootstrap validation (Smoke Test)
        env:
          MT5_PASSWORD: "test"
          MT5_SERVER: "test"
        run: uv run python main.py --show-config
      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-fail-under=80 -v
        env:
          MT5_LOGIN: "0"
          MT5_PASSWORD: "test"
          MT5_SERVER: "test"
          MODE: "demo"

  # -----------------------------------------------------------
  # JOB 4: Docker Build - only on main, needs tests to pass
  # -----------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and verify multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: triqbit/mt5-ai-xauusd-trader:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
