name: Migration Safety

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Migration Reversibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --group dev --extra ctrader --extra research

      - name: Run Migration Reversibility Check
        run: uv run python scripts/verify_migrations.py
